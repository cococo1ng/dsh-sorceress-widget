name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依赖
        run: python -m pip install --upgrade pip pillow

      - name: 产物与源码一致（build 可复现）
        run: |
          python build.py --no-assets
          git diff --exit-code -- plugin/client.js

      - name: 路由 57 项
        run: node plugin/test-routes.mjs

      - name: 账本口径
        run: node test-billing.mjs

      - name: 静态扫描
        run: node tools/checks/static_scan.mjs

      - name: 算法断言
        run: node tools/checks/algo_assert.mjs

      - name: 宿主边界
        run: node tools/checks/host_events.mjs

      - name: 客户端作用域
        run: node tools/checks/client_scope.mjs

      # 十套审计：数据 / 抽牌链 / 客户端↔宿主一致性 / 算法 / 文案 / 状态 /
      #           姿态轮换 / 所问必填 / 发布件一致性 / 合婚对拍
      # 合婚对拍依赖同级仓库 dsh-kuitan-tianji；CI 上没有时脚本自行跳过（退出码 0）
      - name: 十套审计
        run: |
          node tools/checks/audit_data.mjs
          node tools/checks/audit_draw.mjs
          node tools/checks/audit_parity.mjs
          node tools/checks/audit_algo.mjs
          node tools/checks/audit_text.mjs
          node tools/checks/audit_store.mjs
          node tools/checks/audit_pose.mjs
          node tools/checks/audit_question.mjs
          node tools/checks/audit_release.mjs
          node tools/checks/audit_hepan.mjs

      - name: 数据完整性
        run: python tools/checks/data_integrity.py
